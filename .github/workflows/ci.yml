name: Python CI

on:
  push:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python Version
        run: python --version

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Show Files
        run: ls -la
